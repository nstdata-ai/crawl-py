name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching setup.py (for example 1.0.0)
        required: true
        type: string
      commit:
        description: Reviewed main commit (full 40-character SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'nstdata-ai/crawl-py' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      manifest-sha256: ${{ steps.package.outputs.manifest_sha256 }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt build==1.6.1
      - id: package
        run: python scripts/release.py prepare "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
      - run: python scripts/release.py verify "$GITHUB_WORKSPACE/release-artifacts"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/dist
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: 'false'
          verbose: 'false'
          attestations: 'true'
      - run: python scripts/release.py published "$GITHUB_WORKSPACE/release-artifacts"
